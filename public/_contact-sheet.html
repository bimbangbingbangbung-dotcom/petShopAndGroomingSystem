<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Product illustrations — contact sheet</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fff; margin: 24px; }
  h1 { font-size: 18px; margin: 24px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; max-width: 1200px; }
  figure { margin: 0; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden; background: #EFF3F0; }
  img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; }
  figcaption { font-size: 12px; padding: 8px 10px; background: #fff; border-top: 1px solid #e5e7eb; }
</style>
</head>
<body>
<h1>All 12 product illustrations</h1>
<div class="grid">
  <figure><img src="products/dog-food-bag.svg"><figcaption>dog-food-bag</figcaption></figure>
  <figure><img src="products/cat-pouches.svg"><figcaption>cat-pouches</figcaption></figure>
  <figure><img src="products/cat-kibble-bag.svg"><figcaption>cat-kibble-bag</figcaption></figure>
  <figure><img src="products/bone-toy.svg"><figcaption>bone-toy</figcaption></figure>
  <figure><img src="products/feather-wand.svg"><figcaption>feather-wand</figcaption></figure>
  <figure><img src="products/rope-toy.svg"><figcaption>rope-toy</figcaption></figure>
  <figure><img src="products/food-bowl.svg"><figcaption>food-bowl</figcaption></figure>
  <figure><img src="products/collar.svg"><figcaption>collar</figcaption></figure>
  <figure><img src="products/leash.svg"><figcaption>leash</figcaption></figure>
  <figure><img src="products/pee-pads.svg"><figcaption>pee-pads</figcaption></figure>
  <figure><img src="products/spot-on.svg"><figcaption>spot-on</figcaption></figure>
  <figure><img src="products/slicker-brush.svg"><figcaption>slicker-brush</figcaption></figure>
</div>
</body>
</html>
